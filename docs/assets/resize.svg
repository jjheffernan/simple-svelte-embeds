<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
	<title id="title">Three ways to size an embed</title>
	<desc id="desc">Props, parent CSS variables, and a corner drag handle</desc>
	<style>
		.page { fill: #f4f3ef; }
		.ink { fill: #1c1b19; }
		.mute { fill: #5e5c57; }
		.card { fill: #fff; stroke: #e3e1da; stroke-width: 1; }
		.frame { fill: #eceae4; stroke: #d4d1c8; stroke-width: 1; }
		.grip { fill: rgba(0,0,0,0.4); }
		.h { font: 600 18px ui-sans-serif, system-ui, sans-serif; }
		.s { font: 400 13px ui-sans-serif, system-ui, sans-serif; }
		.code { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
		@media (prefers-color-scheme: dark) {
			.page { fill: #111110; }
			.ink { fill: #f4f3ef; }
			.mute { fill: #a8a69f; }
			.card { fill: #1a1917; stroke: #2c2b28; }
			.frame { fill: #242320; stroke: #3a3935; }
			.grip { fill: rgba(255,255,255,0.35); }
		}
	</style>
	<rect class="page" width="960" height="300" rx="18"/>
	<text class="ink h" x="40" y="42">Size it three ways</text>
	<text class="mute s" x="40" y="64">Same box. Props, CSS variables, or drag the corner.</text>

	<g transform="translate(40 92)">
		<rect class="card" width="280" height="170" rx="14"/>
		<text class="ink s" x="20" y="32">Props</text>
		<rect class="frame" x="20" y="48" width="200" height="90" rx="8"/>
		<text class="mute code" x="20" y="162">width="40rem"</text>
	</g>

	<g transform="translate(340 92)">
		<rect class="card" width="280" height="170" rx="14"/>
		<text class="ink s" x="20" y="32">Parent CSS</text>
		<rect class="frame" x="20" y="48" width="180" height="100" rx="8"/>
		<text class="mute code" x="20" y="162">--embed-aspect: 16 / 9</text>
	</g>

	<g transform="translate(640 92)">
		<rect class="card" width="280" height="170" rx="14"/>
		<text class="ink s" x="20" y="32">Drag</text>
		<rect class="frame" x="20" y="48" width="220" height="80" rx="8"/>
		<path class="grip" d="M220 108 L240 128 L220 128 Z" transform="translate(8 0)"/>
		<text class="mute code" x="20" y="162">onresize · resizable</text>
	</g>
</svg>
