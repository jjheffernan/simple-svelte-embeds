<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
	<title id="title">simple-svelte-embeds hero</title>
	<desc id="desc">A framed YouTube embed with poster, play control, resize handle, and footer link</desc>
	<style>
		.page { fill: #f4f3ef; }
